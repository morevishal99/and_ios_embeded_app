name: Build iOS (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm install

      - name: Setup CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Archive (Unsigned for Sideloadly)
        run: |
          xcodebuild -workspace ios/MarkOne.xcworkspace \
            -scheme MarkOne \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/MarkOne.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/MarkOne.xcarchive/Products/Applications/MarkOne.app build/Payload/
          cd build
          zip -r MarkOne.ipa Payload
          echo "IPA created successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkOne-iOS-ipa
          path: build/MarkOne.ipa
          retention-days: 7

